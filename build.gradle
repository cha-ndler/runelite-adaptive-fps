plugins {
	id 'java'
}

ext {
	pluginName = 'Adaptive FPS'
	pluginDescription = 'Keeps the FPS target just below the refresh rate of the monitor the client is on'
	pluginProvider = 'cha-ndler'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.34'
	annotationProcessor 'org.projectlombok:lombok:1.18.34'

	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.chandler.adaptivefps'
version = '1.1.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

// Developer client. The launcher lives in the test source set so it stays out of the published jar.
// -PrlHome=<dir> runs against a scratch RuneLite directory instead of your real one.
tasks.register('run', JavaExec) {
	group = 'application'
	description = 'Runs a developer client with this plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.chandler.adaptivefps.AdaptiveFpsPluginLauncher'
	// -PrlDebug turns on debug logging, which is where the quieter lifecycle details go.
	args = ['--developer-mode'] + (project.hasProperty('rlDebug') ? ['--debug'] : [])
	// ExternalPluginManager.loadBuiltin refuses to run without them.
	jvmArgs = ['-ea']
	if (project.hasProperty('rlHome')) {
		systemProperty 'user.home', project.property('rlHome')
	}
}

java {
	sourceCompatibility = JavaVersion.VERSION_11
	targetCompatibility = JavaVersion.VERSION_11
}
